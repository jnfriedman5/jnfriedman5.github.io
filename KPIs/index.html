<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Single Page Document Viewer</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: #f9f9f9;
      box-sizing: border-box;
    }

    #viewer-container {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      border: 1px solid #ccc;
    }

    canvas, img {
      display: block;
      background: #fff;
      max-height: 100%;
      max-width: 100%;
      image-rendering: auto;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }
  </style>

  <!-- Load PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.min.js"></script>
</head>
<body>
  <div id="viewer-container">
    <canvas id="pdf-canvas" style="display: none;"></canvas>
    <img id="image-viewer" style="display: none;" />
  </div>

  <script>
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    const fileUrl = getQueryParam('file');
    if (!fileUrl) {
      document.body.innerHTML = "<p style='color:red;text-align:center;'>No file specified. Use ?file=yourfile.pdf or .png</p>";
      throw new Error("No file specified");
    }

    const isPDF = fileUrl.toLowerCase().endsWith('.pdf');
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const imageViewer = document.getElementById('image-viewer');

    if (isPDF) {
      canvas.style.display = 'block';
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.worker.min.js';

      let pdfDoc = null;
      let pageNum = 1;
      let pageRendering = false;

      function renderPage(num) {
        pageRendering = true;
        pdfDoc.getPage(num).then(function (page) {
          const container = document.getElementById('viewer-container');
          const containerHeight = container.clientHeight;

          const unscaledViewport = page.getViewport({ scale: 1 });
          const scale = containerHeight / unscaledViewport.height;
          const outputScale = window.devicePixelRatio || 1;
          const viewport = page.getViewport({ scale: scale * outputScale });

          canvas.width = viewport.width;
          canvas.height = viewport.height;
          canvas.style.width = (viewport.width / outputScale) + 'px';
          canvas.style.height = (viewport.height / outputScale) + 'px';

          const renderContext = {
            canvasContext: ctx,
            viewport: viewport
          };

          page.render(renderContext).promise.then(function () {
            pageRendering = false;
          });
        });
      }

      pdfjsLib.getDocument(fileUrl).promise.then(function (pdfDoc_) {
        pdfDoc = pdfDoc_;
        renderPage(pageNum);
      });

      window.addEventListener('resize', function () {
        if (pdfDoc) renderPage(pageNum);
      });

    } else {
      imageViewer.style.display = 'block';
      imageViewer.src = fileUrl;
      imageViewer.alt = 'Document Image';
    }
  </script>
</body>
</html>
