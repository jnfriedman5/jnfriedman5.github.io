<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Viewer with Pagination or Image Display</title>
  <style>
    body {
      margin: 0;
      padding: 10px;
      font-family: sans-serif;
      background: #f9f9f9;
      box-sizing: border-box;
    }

    #controls {
      text-align: center;
      margin-bottom: 10px;
    }

    #viewer-container {
      width: 100vw;
      height: 80vh;
      overflow-y: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #fff;
      border: 1px solid #ccc;
      margin: 0 auto;
    }

    canvas, img {
      display: block;
      max-width: 100%;
      height: auto;
      background: #fff;
    }

    #page-info {
      margin: 0 10px;
    }

    button {
      padding: 4px 12px;
      font-size: 16px;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.min.js"></script>
</head>
<body>

  <div id="controls" style="display: none;">
    <button id="prev-page">Previous</button>
    <span id="page-info">Page 1 / 1</span>
    <button id="next-page">Next</button>
  </div>

  <div id="viewer-container">
    <canvas id="pdf-canvas" style="display: none;"></canvas>
    <img id="image-viewer" style="display: none;" />
  </div>

  <script>
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    const fileUrl = getQueryParam('file');
    if (!fileUrl) {
      document.body.innerHTML = "<p style='color:red;text-align:center;'>No file specified. Use ?file=yourfile.pdf or .png in the URL.</p>";
      throw new Error("No file specified");
    }

    const isPDF = fileUrl.toLowerCase().endsWith('.pdf');
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const imageViewer = document.getElementById('image-viewer');
    const controls = document.getElementById('controls');

    if (isPDF) {
      controls.style.display = 'block';
      canvas.style.display = 'block';

      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.worker.min.js';

      let pdfDoc = null,
          pageNum = 1,
          pageRendering = false,
          pageNumPending = null;

      function renderPage(num) {
        pageRendering = true;
        pdfDoc.getPage(num).then(function(page) {
          const container = document.getElementById('viewer-container');
          const desiredWidth = container.clientWidth;

          let viewport = page.getViewport({ scale: 1 });
          const scale = desiredWidth / viewport.width;
          viewport = page.getViewport({ scale });

          canvas.width = viewport.width;
          canvas.height = viewport.height;

          const renderContext = {
            canvasContext: ctx,
            viewport: viewport
          };
          const renderTask = page.render(renderContext);

          renderTask.promise.then(() => {
            pageRendering = false;
            if (pageNumPending !== null) {
              renderPage(pageNumPending);
              pageNumPending = null;
            }
          });

          document.getElementById('page-info').textContent = 'Page ' + num + ' / ' + pdfDoc.numPages;
        });
      }

      function queueRenderPage(num) {
        if (pageRendering) {
          pageNumPending = num;
        } else {
          renderPage(num);
        }
      }

      function onPrevPage() {
        if (pageNum <= 1) return;
        pageNum--;
        queueRenderPage(pageNum);
      }

      function onNextPage() {
        if (pageNum >= pdfDoc.numPages) return;
        pageNum++;
        queueRenderPage(pageNum);
      }

      document.getElementById('prev-page').addEventListener('click', onPrevPage);
      document.getElementById('next-page').addEventListener('click', onNextPage);

      pdfjsLib.getDocument(fileUrl).promise.then(function(pdfDoc_) {
        pdfDoc = pdfDoc_;
        document.getElementById('page-info').textContent = 'Page 1 / ' + pdfDoc.numPages;
        renderPage(pageNum);
      });

      window.addEventListener('resize', () => {
        if (pdfDoc) queueRenderPage(pageNum);
      });

    } else {
      // Display image file
      imageViewer.style.display = 'block';
      imageViewer.src = fileUrl;
      imageViewer.alt = 'Embedded Image';
    }
  </script>
</body>
</html>
